name: Vello
options:
  bundleIdPrefix: com.alimuratkuslu
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/argmax-oss-swift
    from: 1.1.1
targets:
  Vello:
    type: application
    platform: macOS
    sources: [Vello]
    dependencies:
      - package: WhisperKit
        product: WhisperKit
    info:
      path: Vello/Info.plist
      properties:
        CFBundleDisplayName: Vello
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        CFBundleLocalizations: [en, tr]
        NSMicrophoneUsageDescription: "Vello uses the microphone to turn what you say into text."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alimuratkuslu.vello
        MARKETING_VERSION: "0.1.1"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: 5JMBLLG6WT
        CODE_SIGN_STYLE: Manual
        # Stable identity keeps the Accessibility/Microphone grants across rebuilds (ad-hoc signing resets them).
        CODE_SIGN_IDENTITY: "Apple Development"
        SWIFT_VERSION: "5.10"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Vello/Vello.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
